spring.application.name=payops
server.port=${PORT:8080}

spring.datasource.url=${PAYOPS_DB_URL:jdbc:postgresql://localhost:5432/payops}
spring.datasource.username=${PAYOPS_DB_USERNAME:postgres}
spring.datasource.password=${PAYOPS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# The checked-in schema.sql is intentionally destructive and must be applied manually.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
# Entities are currently returned directly as JSON, so lazy relationships may be traversed during serialization.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Fake Bank Configuration
fakebank.url=${FAKEBANK_URL:http://localhost:8081}
fakebank.timeout-ms=${FAKEBANK_TIMEOUT_MS:5000}

# Pending Payment Recovery Worker Configuration
payops.recovery.enabled=${PAYOPS_RECOVERY_ENABLED:true}
payops.recovery.fixed-delay-ms=${PAYOPS_RECOVERY_INTERVAL_MS:5000}
payops.recovery.batch-size=${PAYOPS_RECOVERY_BATCH_SIZE:50}

# Bank CSV Reconciliation Configuration
payops.reconciliation.max-file-size=${PAYOPS_RECONCILIATION_MAX_FILE_SIZE:5242880}
payops.reconciliation.max-rows=${PAYOPS_RECONCILIATION_MAX_ROWS:5000}

# JWT Authentication Configuration
# PAYOPS_JWT_SECRET is required and must contain at least 32 bytes (256 bits) of cryptographically
# secure random material. Never commit production secrets to source control.
payops.jwt.secret=${PAYOPS_JWT_SECRET:}
payops.jwt.expiration-ms=${PAYOPS_JWT_EXPIRATION_MS:86400000}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
