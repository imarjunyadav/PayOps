spring.application.name=fake-bank-test

# Isolated in-memory H2 configuration for automated tests
spring.datasource.url=jdbc:h2:mem:fakebank_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Default delay 0ms for unit tests
fakebank.delayed-card.delay-ms=0
