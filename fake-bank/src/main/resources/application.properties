spring.application.name=fake-bank
server.port=${PORT:8081}

# Persistent PostgreSQL configuration for runtime
spring.datasource.url=${FAKEBANK_DB_URL:${PAYOPS_DB_URL:jdbc:postgresql://localhost:5432/payops}}
spring.datasource.username=${FAKEBANK_DB_USERNAME:${PAYOPS_DB_USERNAME:postgres}}
spring.datasource.password=${FAKEBANK_DB_PASSWORD:${PAYOPS_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# In production / persistent runtime, schema is managed via sql/migrate-phase1.sql
spring.jpa.hibernate.ddl-auto=${FAKEBANK_JPA_DDL_AUTO:none}
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configurable simulated delay in milliseconds for cards ending in 9 (default: 30000ms for demo)
fakebank.delayed-card.delay-ms=30000
